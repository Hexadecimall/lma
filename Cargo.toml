[package]
name = "lma"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
# build.rs is a standalone release launcher, not a recursive Cargo build hook.
build = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false

[features]
default = ["vision", "image-gen", "speech"]
speech = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hound",
    "dep:rubato",
    "dep:rustfft",
]
image-gen = [
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:image",
    "dep:rand",
    "dep:rand_chacha",
    "dep:rand_distr",
]
vision = ["llama-cpp-2/mtmd"]
metal = [
    "llama-cpp-2/metal",
    "llama-cpp-sys-2/metal",
    "candle-core?/metal",
    "candle-transformers?/metal",
]
cuda = [
    "llama-cpp-2/cuda",
    "llama-cpp-sys-2/cuda",
    "candle-core?/cuda",
    "candle-transformers?/cuda",
]

[dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = [
    "common",
] }
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false }
axum = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"
self_cell = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
sha2 = "0.10"
tempfile = "3"
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
hound = { version = "3.5.1", optional = true }
rubato = { version = "0.16.2", default-features = false, optional = true }
rustfft = { version = "6.4", optional = true }
candle-transformers = { version = "=0.11.0", optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = [
    "fancy-regex",
], optional = true }
image = { version = "0.25", default-features = false, features = [
    "png",
], optional = true }
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }
rand_distr = { version = "0.5", optional = true }

tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-stream = "0.1"
ratatui = { version = "0.29", default-features = false, features = [
    "crossterm",
] }
crossterm = "0.28"
unicode-width = "0.2"

[patch.crates-io]
llama-cpp-2 = { path = "vendor/llama-cpp-2" }
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }
